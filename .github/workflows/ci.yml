name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  api_tests:
    runs-on: ubuntu-latest

    outputs:
      execution_status: ${{ steps.evaluate.outputs.execution_status }}
      report_exists: ${{ steps.evaluate.outputs.report_exists }}
      tests_total: ${{ steps.evaluate.outputs.tests_total }}
      tests_failed: ${{ steps.evaluate.outputs.tests_failed }}
      tests_errors: ${{ steps.evaluate.outputs.tests_errors }}
    
    strategy:
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Show shard
        run: echo "Running shard ${{ matrix.shard }}"

      - name: Build containers
        run: docker compose build

      - name: Start application
        run: docker compose up -d
      
      - name: Run shard
        run: |
          docker compose --profile test run --rm tests \
            pytest \
            --splits 4 \
            --group ${{ matrix.shard }} \
            --junitxml=/reports/results-${{ matrix.shard }}.xml

      # - name: Run API tests
      #   id: tests
      #   continue-on-error: true
      #   run: docker compose --profile test run --rm tests

      - name: Evaluate test results
        id: evaluate
        if: always()
        run: |
          REPORT="tests/reports/results.xml"

          if [ ! -f "$REPORT" ]; then
            echo "execution_status=infrastructure_error" >> "$GITHUB_OUTPUT"
            echo "report_exists=false" >> "$GITHUB_OUTPUT"
            echo "tests_total=0" >> "$GITHUB_OUTPUT"
            echo "tests_failed=0" >> "$GITHUB_OUTPUT"
            echo "tests_errors=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = "tests/reports/results.xml"
          root = ET.parse(report).getroot()

          suites = root.findall("testsuite")

          total = sum(int(s.attrib.get("tests", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("report_exists=true\n")
              f.write(f"tests_total={total}\n")
              f.write(f"tests_failed={failures}\n")
              f.write(f"tests_errors={errors}\n")

              if failures > 0:
                  f.write("execution_status=test_failure\n")
              elif errors > 0:
                  f.write("execution_status=test_execution_error\n")
              else:
                  f.write("execution_status=success\n")
          PY

      - name: Docker status
        if: always()
        run: docker compose ps

      - name: Collect Docker logs
        if: always()
        run: docker compose logs > docker-logs.txt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.shard }}
          path: tests/reports/results-${{ matrix.shard }}.xml

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs.txt

      - name: Cleanup
        if: always()
        run: docker compose down -v

